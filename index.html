<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournament Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#0E5E45; --pitch-d:#08402F; --pitch-l:#E3EFE9;
  --chalk:#F3F5F1; --ink:#17222B; --muted:#5D6A72; --line:#D6DDD6; --card:#FFFFFF;
  --yellow:#F2BE22; --red:#D13A2B; --blue:#2463A8; --amber:#B7791F;
  --night:#04241A; --night-2:#0A3527;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;color:var(--ink);background:var(--chalk);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--pitch)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--pitch-d);color:#DCEBE4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;font-family:var(--f-cond);font-weight:800;font-size:24px;line-height:1;color:#fff;letter-spacing:.2px}
.brand small{display:block;margin-top:4px;color:#9FC3B3;font-size:13px}
#nav{padding:8px 10px 20px;flex:1}
#nav h6{margin:16px 10px 4px;font-size:12px;font-weight:600;color:#86AE9D}
#nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:5px;color:#E7F1EC;text-decoration:none;font-weight:500}
#nav a:hover{background:rgba(255,255,255,.06)}
#nav a.on{background:#fff;color:var(--pitch-d);font-weight:700}
#nav a .n{font-size:12px;background:rgba(255,255,255,.12);padding:0 7px;border-radius:9px}
#nav a.on .n{background:var(--pitch-l)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(209,58,43,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(209,58,43,0)}100%{box-shadow:0 0 0 0 rgba(209,58,43,0)}}
.side-foot{padding:14px 20px;font-size:12px;color:#86AE9D;border-top:1px solid rgba(255,255,255,.08)}
#shell{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top .menu{display:none}
#top select{max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-weight:600}
#top .grow{flex:1}
#main{padding:24px;max-width:1280px;width:100%}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--f-cond);font-weight:700;line-height:1.1;margin:0}
h1{font-size:34px}
h2{font-size:24px}
h3{font-size:19px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.cond{font-family:var(--f-cond)}
.right{text-align:right}
.nowrap{white-space:nowrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#AEB9AF}
.btn.pri{background:var(--pitch);border-color:var(--pitch);color:#fff}
.btn.pri:hover{background:var(--pitch-d)}
.btn.warn{background:var(--yellow);border-color:#D9A80F;color:#2A2100}
.btn.dang{color:var(--red);border-color:#EBC2BD}
.btn.dang.solid{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.lg{padding:12px 18px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;background:#E9EDEA;color:var(--muted);white-space:nowrap}
.b-live{background:var(--red);color:#fff}
.b-ok{background:#D7EEDF;color:#13633E}
.b-warn{background:#FCEFC7;color:#7A5A00}
.b-bad{background:#F8DCD8;color:#9B2417}
.b-blue{background:#DCE8F6;color:#1C4F86}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}

/* ---------- panels & tables ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel>.pb{padding:14px 16px}
.panel.flush>.pb{padding:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.cols>.panel{margin-bottom:0}
.stack>*+*{margin-top:18px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFBF9;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #ECEFEB;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hl td{background:#FFF9E3}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.act{text-align:right;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* stat line */
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:18px}
.statline>div{padding:12px 16px;border-right:1px solid var(--line)}
.statline>div:last-child{border-right:0}
.statline b{display:block;font-family:var(--f-cond);font-size:26px;font-weight:700;line-height:1.1}
.statline span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:#E8ECE8;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pitch)}
.bar.red i{background:var(--red)}

/* ---------- matchday strip (dashboard hero) ---------- */
.strip{background:var(--night);color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.strip:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 60px,transparent 60px 120px);pointer-events:none}
.strip .meta{position:relative;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#9FC3B3;font-size:14px}
.strip .meta b{color:#fff}
.strip .row{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:10px 0 12px}
.strip .tm{font-family:var(--f-cond);font-weight:700;font-size:clamp(20px,3vw,32px);line-height:1.05}
.strip .tm.r{text-align:right}
.strip .tm i{display:block;width:34px;height:5px;border-radius:2px;margin-bottom:6px}
.strip .tm.r i{margin-left:auto}
.strip .sc{font-family:var(--f-cond);font-weight:800;font-size:clamp(48px,8vw,84px);line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.strip .sc small{display:block;font-size:16px;font-weight:600;color:var(--yellow);margin-top:6px}
.strip .btns{position:relative}
.strip .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.strip .btn.warn{background:var(--yellow);color:#2A2100;border-color:var(--yellow)}

/* ---------- live console ---------- */
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;background:var(--night);color:#fff;border-radius:var(--r);padding:20px}
.scorebox .tm h2{font-size:clamp(20px,3vw,34px)}
.scorebox .tm i{display:block;height:6px;width:44px;border-radius:3px;margin-bottom:8px}
.scorebox .tm.r{text-align:right}.scorebox .tm.r i{margin-left:auto}
.scorebox .tm small{color:#9FC3B3}
.scorebox .sc{text-align:center}
.scorebox .sc b{font-family:var(--f-cond);font-weight:800;font-size:clamp(56px,9vw,110px);line-height:.85;font-variant-numeric:tabular-nums}
.scorebox .sc .sep{font-family:var(--f-cond);font-size:48px;color:#5E8B79;padding:0 10px;vertical-align:18px}
.scorebox .clock{font-family:var(--f-cond);font-weight:700;font-size:30px;color:var(--yellow);font-variant-numeric:tabular-nums}
.scorebox .sub{color:#B8D3C7;font-size:14px;margin-top:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0}
.ctrl select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.side-p{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:5px solid var(--c,#888)}
.side-p h3{margin-bottom:10px}
.side-p select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:#fff}
.bigbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bigbtns .btn{padding:12px 8px;font-size:15px}
.bigbtns .btn.score{background:var(--pitch);color:#fff;border-color:var(--pitch);font-family:var(--f-cond);font-size:20px}
.set-now{font-family:var(--f-cond);font-size:56px;font-weight:800;text-align:center;line-height:1;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.feed{max-height:460px;overflow-y:auto}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:9px 14px;border-bottom:1px solid #ECEFEB;align-items:start}
.ev .mn{font-family:var(--f-cond);font-weight:700;color:var(--pitch);font-size:17px}
.ev.k-goal{background:#F0F8F3}
.ev.k-yc .mn{color:var(--amber)}
.ev.k-rc .mn{color:var(--red)}
.ev.k-com .t{color:var(--ink)}
.comm-box{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.comm-box textarea{flex:1;resize:vertical;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}

/* ---------- bracket ---------- */
.bracket{display:flex;gap:22px;overflow-x:auto;padding:16px}
.bracket .rd{min-width:200px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bracket .rd h4{font-size:16px;color:var(--muted);margin-bottom:4px}
.bm{border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:14px}
.bm div{display:flex;justify-content:space-between;padding:6px 10px;gap:8px}
.bm div+div{border-top:1px solid #ECEFEB}
.bm .w{font-weight:700;background:#F0F8F3}

/* ---------- forms & modal ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px}
.fld>span{font-weight:600;color:var(--muted);font-size:13px}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%}
.fld small{color:var(--muted)}
.full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:17px;height:17px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r);max-height:180px;overflow:auto}
#modal{position:fixed;inset:0;background:rgba(10,25,20,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow-y:auto}
#mBox{background:#fff;border-radius:8px;width:100%;max-width:620px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#mBox.wide{max-width:900px}
#mBox>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
#mBody{padding:18px}
#mBox>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FAFBF9;border-radius:0 0 8px 8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;z-index:200;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* ---------- screen modes (public board / overlay) ---------- */
#screen{display:none}
body.screen-mode #app{display:none}
body.screen-mode #screen{display:block}
body.board-mode{background:var(--night);color:#fff}
.board{min-height:100vh;padding:22px clamp(14px,3vw,40px)}
.board-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:12px;margin-bottom:20px}
.board-top h1{font-size:clamp(26px,4vw,44px)}
.board-top span{color:#9FC3B3}
.board-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
.bpanel{background:var(--night-2);border-radius:var(--r);padding:16px;margin-bottom:22px}
.bpanel h3{color:#9FC3B3;font-size:18px;margin-bottom:10px;font-weight:600}
.big-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:10px 0}
.big-score .tm{font-family:var(--f-cond);font-weight:700;font-size:clamp(24px,4vw,52px);line-height:1}
.big-score .tm.r{text-align:right}
.big-score .tm i{display:block;height:7px;width:60px;border-radius:3px;margin-bottom:10px}
.big-score .tm.r i{margin-left:auto}
.big-score .sc{font-family:var(--f-cond);font-weight:800;font-size:clamp(70px,12vw,170px);line-height:.85;text-align:center;font-variant-numeric:tabular-nums}
.board .clk{text-align:center;font-family:var(--f-cond);font-size:clamp(26px,3vw,44px);color:var(--yellow);font-weight:700}
.board table{width:100%;border-collapse:collapse;font-size:15px}
.board th{color:#86AE9D;font-weight:600;text-align:left;padding:6px 8px;font-size:13px}
.board td{padding:7px 8px;border-top:1px solid rgba(255,255,255,.08)}
.board .num{text-align:right;font-variant-numeric:tabular-nums}
.bev{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.bev .mn{font-family:var(--f-cond);font-weight:700;color:var(--yellow);font-size:18px}
.video{position:relative;padding-top:56.25%;background:#000;border-radius:var(--r);overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mini-res{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);align-items:center}
.mini-res .r{text-align:right}
.mini-res b{font-family:var(--f-cond);font-size:20px;font-variant-numeric:tabular-nums}
.board .bm{background:var(--night);border-color:rgba(255,255,255,.15)}
.board .bm div+div{border-top-color:rgba(255,255,255,.1)}
.board .bm .w{background:var(--pitch)}
.board .bracket{padding:0}
body.overlay-mode{background:transparent!important}
.ovl{display:inline-flex;align-items:stretch;margin:16px;font-family:var(--f-cond);font-weight:700;color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.ovl>div{display:flex;align-items:center;padding:6px 14px}
.ovl .t{background:var(--night);min-width:120px;gap:10px}
.ovl .t i{width:8px;height:30px;border-radius:2px}
.ovl .s{background:#fff;color:var(--night);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;padding:6px 18px}
.ovl .c{background:var(--yellow);color:#2A2100;font-variant-numeric:tabular-nums}
.ovl .p{background:var(--night-2);font-size:20px;color:#B8D3C7}

/* lock */
.lock{max-width:360px;margin:10vh auto;text-align:center}
.lock input{width:100%;padding:12px;font-size:22px;text-align:center;letter-spacing:6px;border:1px solid var(--line);border-radius:var(--r);margin:14px 0}

/* ---------- responsive ---------- */
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s}
  body.nav-open #side{transform:none}
  body.nav-open:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
  #top{padding:10px 14px;gap:8px}
  #top select{flex:1;min-width:0}
  #top .grow{display:none}
  #top .menu{display:inline-flex}
  #main{padding:16px 14px}
  .sides,.board-grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .statline>div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .scorebox{grid-template-columns:1fr;text-align:center}
  .scorebox .tm.r{text-align:center}.scorebox .tm i,.scorebox .tm.r i{margin:0 auto 8px}
  .strip .row{grid-template-columns:1fr;text-align:center}
  .strip .tm.r{text-align:center}.strip .tm i,.strip .tm.r i{margin:0 auto 6px}
  #top .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}#side{transition:none}}
@media print{
  #side,#top,.noprint,.btn,.toolbar{display:none!important}
  #main{padding:0;max-width:none}
  body{background:#fff}
  .panel{border:0;break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b id="brandName">Tournament Office</b><small id="brandSub">Tournament management</small></div>
    <nav id="nav"></nav>
    <div class="side-foot" id="modeInfo"></div>
  </aside>
  <div id="shell">
    <header id="top">
      <button class="btn sm menu" onclick="document.body.classList.toggle('nav-open')" aria-label="Open menu">Menu</button>
      <select id="curSel" onchange="setCur(this.value)" aria-label="Active tournament"></select>
      <span class="grow"></span>
      <span id="liveTop"></span>
      <a class="btn sm hide-sm" id="boardLink" target="_blank" rel="noopener">Public scoreboard</a>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="screen"></div>

<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()">
  <div id="mBox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle"></h3><button class="btn sm" onclick="closeModal()" aria-label="Close">Close</button></header>
    <div id="mBody"></div>
    <footer><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="mSave" onclick="modalSubmit()">Save</button></footer>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
/* =====================================================================
   TOURNAMENT OFFICE — single-file sports tournament management system
   Storage: browser localStorage by default, Firebase Firestore optional
   (Settings > Cloud sync). All top-level state uses var/function to
   avoid TDZ issues with async Firebase loading.
   ===================================================================== */
var APP_KEY = 'tms_data_v1', FB_KEY = 'tms_fbcfg_v1', CUR_KEY = 'tms_cur_v1', PIN_OK = 'tms_pin_ok';
var COLS = ['tournaments','teams','players','matches','referees','trophies','transactions','payments'];
var DB = {}; COLS.forEach(function(c){ DB[c] = []; });
var SETTINGS = { org:'Tournament Office', currency:'MVR', pin:'', venues:['Main ground'] };
var MODE = 'local', FS = null, CUR = localStorage.getItem(CUR_KEY) || '';
var FB_VER = '10.12.2';

var SPORTS = {
  'Football':     { mode:'goals',  clock:true,  dur:45, periods:['1st half','Half-time','2nd half','Extra time','Penalties'], events:['Yellow card','Red card','Substitution','Foul','Corner','Penalty','Save','Injury'], positions:['Goalkeeper','Defender','Midfielder','Forward'] },
  'Futsal':       { mode:'goals',  clock:true,  dur:20, periods:['1st half','Half-time','2nd half','Extra time','Penalties'], events:['Yellow card','Red card','Substitution','Foul','Timeout','Save','Penalty'], positions:['Goalkeeper','Defender','Winger','Pivot'] },

/* ---------------- persistence ---------------- */
function persistLocal(){
  try { localStorage.setItem(APP_KEY, JSON.stringify({ db:DB, settings:SETTINGS })); }
  catch(e){ toast('Browser storage is full. Export a backup and switch to cloud sync.'); }
}
function loadLocal(){
  try {
    var d = JSON.parse(localStorage.getItem(APP_KEY) || 'null');
    if(d){ COLS.forEach(function(c){ DB[c] = (d.db && d.db[c]) || []; }); Object.assign(SETTINGS, d.settings || {}); }
  } catch(e){ console.error(e); }
}
function save(col, obj){
  if(!obj.id) obj.id = uid();
  if(!obj.createdAt) obj.createdAt = Date.now();
  obj.updatedAt = Date.now();
  var arr = DB[col], i = arr.findIndex(function(x){ return x.id === obj.id; });
  if(i >= 0) arr[i] = obj; else arr.push(obj);
  if(MODE === 'firebase') FS.collection(col).doc(obj.id).set(clone(obj)).catch(fbErr);
  else persistLocal();
  scheduleRender();
  return obj;
}
function removeDoc(col, id){
  DB[col] = DB[col].filter(function(x){ return x.id !== id; });
  if(MODE === 'firebase') FS.collection(col).doc(id).delete().catch(fbErr);
  else persistLocal();
  scheduleRender();
}
function saveSettings(){

/* ---------------- Firebase (optional) ---------------- */
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('Could not load ' + src)); }; document.head.appendChild(s); }); }
function initFirebase(cfg){
  var base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  return loadScript(base + 'firebase-app-compat.js')
    .then(function(){ return loadScript(base + 'firebase-firestore-compat.js'); })
    .then(function(){
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      FS = firebase.firestore(app);
      MODE = 'firebase';
      return pullAll();
    })
    .then(function(){
      COLS.forEach(function(c){
        FS.collection(c).onSnapshot(function(s){ DB[c] = s.docs.map(function(d){ return d.data(); }); scheduleRender(); }, fbErr);
      });
      FS.collection('meta').doc('settings').onSnapshot(function(d){ if(d.exists){ Object.assign(SETTINGS, d.data()); scheduleRender(); } }, fbErr);
      // polling fallback in case a listener stalls on a weak connection
      setInterval(function(){ pullAll().then(scheduleRender).catch(function(){}); }, 30000);
    });
}
function pullAll(){
  var jobs = COLS.map(function(c){ return FS.collection(c).get().then(function(s){ DB[c] = s.docs.map(function(d){ return d.data(); }); }); });
  jobs.push(FS.collection('meta').doc('settings').get().then(function(d){ if(d.exists) Object.assign(SETTINGS, d.data()); }));
  return Promise.all(jobs);
}
function uploadLocalToCloud(){
  if(MODE !== 'firebase') return toast('Connect to Firebase first');
  var local; try { local = JSON.parse(localStorage.getItem(APP_KEY) || 'null'); } catch(e){}
  if(!local || !local.db) return toast('No local data found on this device');
  if(!confirm('Upload all data stored on this device to Firebase? Records with the same ID will be overwritten.')) return;
  var writes = [];
  COLS.forEach(function(c){ (local.db[c] || []).forEach(function(o){ writes.push(FS.collection(c).doc(o.id).set(o)); }); });
  writes.push(FS.collection('meta').doc('settings').set(local.settings || SETTINGS));
  Promise.all(writes).then(function(){ toast('Uploaded ' + (writes.length - 1) + ' records'); return pullAll(); }).then(scheduleRender).catch(fbErr);
}

function route(){ var p = (location.hash.slice(1) || 'dashboard').split('/'); return { name:p[0], a:p[1] ? decodeURIComponent(p[1]) : '', b:p[2] ? decodeURIComponent(p[2]) : '' }; }

function keepState(){

/* ---------------- lookups ---------------- */
function getCur(){

}
function setCur(id){ CUR = id; localStorage.setItem(CUR_KEY, id); render(); }
function tTeams(tid){ return DB.teams.filter(function(x){ return x.tournamentId === tid; }).sort(function(a,b){ return a.name.localeCompare(b.name); }); }

function teamPlayers(teamId){ return DB.players.filter(function(p){ return p.teamId === teamId; }).sort(function(a,b){ return num(a.number, 999) - num(b.number, 999) || a.name.localeCompare(b.name); }); }
function mSort(a, b){ return ((a.date || '9999') + (a.time || '99')).localeCompare((b.date || '9999') + (b.time || '99')) || num(a.round) - num(b.round) || num(a.slot) - num(b.slot); }

function sportOf(m){ var t = byId('tournaments', m.tournamentId); return SPORTS[t && t.sport] || SPORTS.Other; }
function isLive(m){ return m.status === 'live' || m.status === 'break'; }
function refNames(m){ return (m.refereeIds || []).map(function(id){ var r = byId('referees', id); return r ? r.name : ''; }).filter(Boolean).join(', '); }
function feeDue(team){ var t = byId('tournaments', team.tournamentId); return team.fee === '' || team.fee == null ? num(t && t.entryFee) : num(team.fee); }
function feePaid(team){ return DB.payments.filter(function(p){ return p.teamId === team.id; }).reduce(function(s,p){ return s + num(p.amount); }, 0); }

/* ---------------- scoring engine ---------------- */
function overs(b){ b = num(b); return Math.floor(b / 6) + '.' + (b % 6); }
function score(m){
  var sp = sportOf(m);
  if(sp.mode === 'sets'){
    var sets = m.sets && m.sets.length ? m.sets : [{ h:0, a:0 }];
    var done = m.status === 'finished' ? sets : sets.slice(0, -1);
    var h = 0, a = 0;
    done.forEach(function(s){ if(s.h > s.a) h++; else if(s.a > s.h) a++; });
    var shown = sets.filter(function(s, i){ return s.h || s.a || i < sets.length - 1; });
    return { h:h, a:a, hT:String(h), aT:String(a), cur:sets[sets.length - 1], sub:shown.map(function(s){ return s.h + '-' + s.a; }).join('  ') };
  }
  if(sp.mode === 'cricket'){
    var c = m.cricket || {}, H = c.home || { r:0, w:0, b:0 }, A = c.away || { r:0, w:0, b:0 };
    return { h:H.r, a:A.r, hT:H.r + '/' + H.w, aT:A.r + '/' + A.w, sub:overs(H.b) + ' ov  v  ' + overs(A.b) + ' ov' };
  }
  var hh = 0, aa = 0;
  (m.events || []).forEach(function(e){ if(e.pts){ if(e.side === 'home') hh += e.pts; else aa += e.pts; } });
  return { h:hh, a:aa, hT:String(hh), aT:String(aa), sub:m.pens ? 'Penalties ' + m.pens.h + '-' + m.pens.a : '' };
}
function winnerOf(m){
  if(m.status !== 'finished') return null;
  if(m.bye) return m.homeId;
  if(m.winnerId) return m.winnerId;
  var s = score(m);
  if(s.h > s.a) return m.homeId;
  if(s.a > s.h) return m.awayId;
  return null;
}
function loserOf(m){ var w = winnerOf(m); if(!w || m.bye) return null; return w === m.homeId ? m.awayId : m.homeId; }

/* clocks */
function clockSecs(m){ var c = m.clock || {}; var s = num(c.base); if(c.running && c.startedAt) s += (Date.now() - c.startedAt) / 1000; return Math.max(0, Math.floor(s)); }
function fmtClock(s){ return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function minuteOf(m){ return sportOf(m).clock ? Math.floor(clockSecs(m) / 60) + 1 : ''; }
function tickClocks(){
  document.querySelectorAll('[data-clock]').forEach(function(el){
    var m = byId('matches', el.getAttribute('data-clock'));
    if(m) el.textContent = fmtClock(clockSecs(m));
  });
}
setInterval(tickClocks, 1000);

/* standings */
function groupsOf(tid){ var g = {}; tTeams(tid).forEach(function(t){ if(t.group) g[t.group] = 1; }); return Object.keys(g).sort(); }
function standings(t, group){
  var R = {};
  tTeams(t.id).filter(function(x){ return !group || x.group === group; }).forEach(function(x){ R[x.id] = { team:x, P:0, W:0, D:0, L:0, F:0, A:0, Pts:0, form:[] }; });
  var pw = num(t.ptsWin, 3), pd = num(t.ptsDraw, 1), pl = num(t.ptsLoss, 0);
  tMatches(t.id).filter(function(m){ return !m.ko && !m.bye && m.status === 'finished' && R[m.homeId] && R[m.awayId]; }).forEach(function(m){
    var s = score(m), h = R[m.homeId], a = R[m.awayId], w = winnerOf(m);
    h.P++; a.P++; h.F += s.h; h.A += s.a; a.F += s.a; a.A += s.h;
    if(w === m.homeId){ h.W++; a.L++; h.Pts += pw; a.Pts += pl; h.form.push('W'); a.form.push('L'); }
    else if(w === m.awayId){ a.W++; h.L++; a.Pts += pw; h.Pts += pl; a.form.push('W'); h.form.push('L'); }
    else { h.D++; a.D++; h.Pts += pd; a.Pts += pd; h.form.push('D'); a.form.push('D'); }
  });
  return Object.keys(R).map(function(k){ return R[k]; }).sort(function(x, y){ return y.Pts - x.Pts || (y.F - y.A) - (x.F - x.A) || y.F - x.F || x.team.name.localeCompare(y.team.name); });
}
function playerStats(tid){
  var S = {};
  DB.matches.filter(function(m){ return m.tournamentId === tid; }).forEach(function(m){
    (m.events || []).forEach(function(e){
      if(!e.playerId) return;
      var s = S[e.playerId] = S[e.playerId] || { goals:0, pts:0, yc:0, rc:0, motm:0 };
      if(e.pts && e.type !== 'Own goal'){ s.pts += e.pts; if(e.type === 'Goal') s.goals++; }
      if(e.type === 'Yellow card') s.yc++;
      if(e.type === 'Red card') s.rc++;
    });
    if(m.motm){ var s2 = S[m.motm] = S[m.motm] || { goals:0, pts:0, yc:0, rc:0, motm:0 }; s2.motm++; }
  });
  return S;
}

/* finance ledger: manual transactions + entry fee payments + trophy costs */
function ledger(tid){
  var L = [];
  DB.payments.filter(function(p){ return !tid || p.tournamentId === tid; }).forEach(function(p){
    L.push({ id:p.id, src:'payment', type:'income', category:'Entry fees', amount:num(p.amount), date:p.date, method:p.method, desc:'Entry fee: ' + teamName(p.teamId) + (p.ref ? ' (ref ' + p.ref + ')' : '') });
  });
  DB.transactions.filter(function(x){ return !tid || x.tournamentId === tid; }).forEach(function(x){
    L.push(Object.assign({ src:'txn' }, x, { amount:num(x.amount) }));
  });
  DB.trophies.filter(function(x){ return (!tid || x.tournamentId === tid) && num(x.cost) > 0 && x.status !== 'Planned'; }).forEach(function(x){
    L.push({ id:x.id, src:'trophy', type:'expense', category:'Trophies & medals', amount:num(x.cost), date:x.date || '', desc:x.title + (num(x.qty) > 1 ? ' x' + x.qty : '') + (x.supplier ? ', ' + x.supplier : '') });
  });
  return L.sort(function(a, b){ return (b.date || '').localeCompare(a.date || ''); });
}
function finTotals(tid){
  var inc = 0, exp = 0;
  ledger(tid).forEach(function(x){ if(x.type === 'income') inc += x.amount; else exp += x.amount; });
  return { inc:inc, exp:exp, bal:inc - exp };
}

/* embeds */
function embedUrl(u){
  if(!u) return '';
  var ch = u.match(/youtube\.com\/channel\/(UC[\w-]+)/);
  if(ch) return 'https://www.youtube.com/embed/live_stream?channel=' + ch[1] + '&autoplay=1&mute=1';
  var y = u.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/);
  if(y) return 'https://www.youtube.com/embed/' + y[1] + '?autoplay=1&mute=1';
  if(/facebook\.com|fb\.watch/.test(u)) return 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(u) + '&show_text=false&autoplay=true&mute=true';
  return '';
}
function streamFor(m, t){
  return (m && (m.youtubeUrl || m.facebookUrl)) || (t && (t.youtubeUrl || t.facebookUrl)) || '';
}
function videoHtml(u){ var e = embedUrl(u); return e ? '<div class="video"><iframe src="' + esc(e) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Live stream"></iframe></div>' : ''; }
</script>
<script>

/* ---------------- dashboard ---------------- */
function vDashboard(){

  h += '<div class="statline">' +

    '<div><b>' + players.length + '</b><span>Players</span></div>' +
    '<div><b>' + done.length + ' / ' + ms.length + '</b><span>Matches played</span><div class="bar"><i style="width:' + (ms.length ? done.length / ms.length * 100 : 0) + '%"></i></div></div>' +
    '<div><b>' + money(paid) + '</b><span>Entry fees of ' + money(due) + '</span><div class="bar"><i style="width:' + (due ? Math.min(100, paid / due * 100) : 0) + '%"></i></div></div>' +
    '<div><b style="color:' + (fin.bal < 0 ? 'var(--red)' : 'inherit') + '">' + money(fin.bal) + '</b><span>Balance</span></div>' +
    '</div>';

  h += '<div class="cols">';
  h += '<section class="panel"><header><h3>Next fixtures</h3><a href="#matches" class="small">All fixtures</a></header><div class="pb" style="padding:0">' + miniList(up.slice(0, 6), true) + '</div></section>';
  h += '<section class="panel"><header><h3>Latest results</h3><a href="#standings" class="small">Standings</a></header><div class="pb" style="padding:0">' + miniList(done.slice(-6).reverse(), false) + '</div></section>';
  h += '<section class="panel"><header><h3>Top scorers</h3></header><div class="pb" style="padding:0"><table class="tbl"><tbody>' +
    (scorers.length ? scorers.map(function(x, i){ return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(x.p.name) + '</b><div class="small muted">' + esc(teamName(x.p.teamId)) + '</div></td><td class="num"><b>' + x.s.pts + '</b></td></tr>'; }).join('') : emptyRow(3, 'No scorers yet', 'Scores recorded with a player selected appear here.')) +
    '</tbody></table></div></section>';
  h += '</div>';
  return h;
}
function stripHtml(m, t){
  var s = score(m), sp = sportOf(m), live = isLive(m);
  var clk = live && sp.clock ? '<small data-clock="' + m.id + '">' + fmtClock(clockSecs(m)) + '</small>' : '<small>' + (live ? esc(m.period || 'Live') : esc(fmtDate(m.date) + ' ' + (m.time || ''))) + '</small>';
  return '<section class="strip"><div class="meta"><span>' + (live ? '<span class="livedot"></span> <b>Live now</b>' : '<b>Next up</b>') + (m.stage ? ', ' + esc(m.stage) : '') + '</span><span>' + esc(m.venue || '') + '</span></div>' +
    '<div class="row"><div class="tm"><i style="background:' + esc(teamColor(m.homeId)) + '"></i>' + esc(teamName(m.homeId)) + '</div>' +
    '<div class="sc">' + (live || m.status === 'finished' ? esc(s.hT) + ' - ' + esc(s.aT) : 'v') + clk + '</div>' +
    '<div class="tm r"><i style="background:' + esc(teamColor(m.awayId)) + '"></i>' + esc(teamName(m.awayId)) + '</div></div>' +
    '<div class="btns"><a class="btn warn" href="#live/' + m.id + '">' + (live ? 'Continue scoring' : 'Open scoring') + '</a><a class="btn" href="#match/' + m.id + '" target="_blank" rel="noopener">Match scoreboard</a></div></section>';
}
function miniList(list, upcoming){
  if(!list.length) return '<div class="empty">' + (upcoming ? 'No upcoming fixtures.' : 'No results yet.') + '</div>';
  return '<table class="tbl"><tbody>' + list.map(function(m){
    var s = score(m);

      '<td><span class="dot" style="background:' + esc(teamColor(m.homeId)) + '"></span>' + esc(teamName(m.homeId)) + '<br><span class="dot" style="background:' + esc(teamColor(m.awayId)) + '"></span>' + esc(teamName(m.awayId)) + '</td>' +
      '<td class="num cond" style="font-size:18px">' + (upcoming ? '<a class="btn sm" href="#live/' + m.id + '">Score</a>' : '<b>' + esc(s.hT) + '<br>' + esc(s.aT) + '</b>') + '</td></tr>';
  }).join('') + '</tbody></table>';
}
function vWelcome(){
  return '<section class="strip" style="padding:28px"><div class="row" style="grid-template-columns:1fr;text-align:left;margin:0 0 12px"><div class="tm" style="font-size:clamp(30px,5vw,52px)">Run the whole tournament from one place.</div></div>' +
    '<p style="position:relative;max-width:60ch;color:#CFE3DA;margin:0 0 18px">Register teams and players, collect entry fees, generate fixtures, score matches live, stream to YouTube or Facebook with a scoreboard overlay, track referees, trophies and every rufiyaa in and out.</p>' +
    '<div class="btns"><button class="btn warn lg" onclick="editTournament()">Create tournament</button><button class="btn lg" onclick="loadDemo()">Load demo data</button></div></section>';
}

/* ---------------- tournaments ---------------- */
function vTournaments(){
  var ts = DB.tournaments.slice().sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
  var cur = getCur();
  return head('Tournaments', 'Each tournament has its own sport, format, fees, teams and fixtures. The one selected at the top is the one you are working on.', '<button class="btn pri" onclick="editTournament()">Create tournament</button>') +
    '<section class="panel flush"><div class="pb tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Sport</th><th>Format</th><th>Dates</th><th class="num">Teams</th><th class="num">Entry fee</th><th>Status</th><th></th></tr></thead><tbody>' +
    (ts.length ? ts.map(function(t){
      return '<tr class="' + (cur && cur.id === t.id ? 'hl' : '') + '"><td><b>' + esc(t.name) + '</b><div class="small muted">' + esc(t.category || '') + '</div></td><td>' + esc(t.sport) + '</td><td>' + esc(FORMAT_LABEL[t.format] || t.format) + '</td>' +
        '<td class="small nowrap">' + esc(fmtDate(t.startDate)) + (t.endDate ? '<br>' + esc(fmtDate(t.endDate)) : '') + '</td><td class="num">' + tTeams(t.id).length + '</td><td class="num">' + money(t.entryFee) + '</td>' +
        '<td><span class="badge ' + (t.status === 'Ongoing' ? 'b-live' : t.status === 'Completed' ? 'b-ok' : t.status === 'Registration open' ? 'b-blue' : '') + '">' + esc(t.status || 'Upcoming') + '</span></td>' +
        '<td class="act">' + (cur && cur.id === t.id ? '<span class="small muted">Selected </span>' : '<button class="btn sm" onclick="setCur(\'' + t.id + '\')">Select</button> ') +
        '<button class="btn sm" onclick="editTournament(\'' + t.id + '\')">Edit</button> <button class="btn sm dang" onclick="delTournament(\'' + t.id + '\')">Delete</button></td></tr>';
    }).join('') : emptyRow(8, 'No tournaments yet', 'Create your first tournament to get started.')) +
    '</tbody></table></div></section>';
}
var FORMAT_LABEL = { league:'League (round robin)', knockout:'Knockout', groups:'Groups + knockout' };
function editTournament(id){
  var t = byId('tournaments', id) || { sport:'Football', format:'league', status:'Registration open', entryFee:0, ptsWin:3, ptsDraw:1, ptsLoss:0, startDate:today(), maxPlayers:15, minPlayers:7, thirdPlace:true, oversLimit:10 };
  var venues = (SETTINGS.venues || []);
  var body =
    fld({ n:'name', l:'Tournament name', v:t.name, req:true, full:true, ph:'e.g. Inter-office Futsal Cup 2026' }) +
    fld({ n:'sport', l:'Sport', t:'select', v:t.sport, opts:Object.keys(SPORTS) }) +
    fld({ n:'category', l:'Category / division', v:t.category, ph:"Men's open, Ladies, U-16..." }) +
    fld({ n:'format', l:'Format', t:'select', v:t.format, opts:[{ v:'league', l:FORMAT_LABEL.league }, { v:'knockout', l:FORMAT_LABEL.knockout }, { v:'groups', l:FORMAT_LABEL.groups }] }) +
    fld({ n:'status', l:'Status', t:'select', v:t.status, opts:['Upcoming','Registration open','Ongoing','Completed','Cancelled'] }) +
    fld({ n:'startDate', l:'Start date', t:'date', v:t.startDate }) +
    fld({ n:'endDate', l:'End date', t:'date', v:t.endDate }) +
    fld({ n:'venue', l:'Main venue', v:t.venue, list:'venueList' }) + '<datalist id="venueList">' + venues.map(function(v){ return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>' +
    fld({ n:'entryFee', l:'Entry fee per team (' + SETTINGS.currency + ')', t:'number', v:t.entryFee, step:'0.01', min:0 }) +
    fld({ n:'maxTeams', l:'Maximum teams', t:'number', v:t.maxTeams, min:2 }) +
    fld({ n:'regDeadline', l:'Registration deadline', t:'date', v:t.regDeadline }) +
    fld({ n:'minPlayers', l:'Minimum players per team', t:'number', v:t.minPlayers, min:1 }) +
    fld({ n:'maxPlayers', l:'Maximum players per team', t:'number', v:t.maxPlayers, min:1 }) +
    fld({ n:'ptsWin', l:'Points for a win', t:'number', v:t.ptsWin }) +
    fld({ n:'ptsDraw', l:'Points for a draw', t:'number', v:t.ptsDraw }) +
    fld({ n:'ptsLoss', l:'Points for a loss', t:'number', v:t.ptsLoss }) +
    fld({ n:'matchMinutes', l:'Minutes per period', t:'number', v:t.matchMinutes, hint:'Leave blank to use the sport default.' }) +
    fld({ n:'oversLimit', l:'Overs per innings (cricket)', t:'number', v:t.oversLimit }) +
    fld({ n:'thirdPlace', l:'Play a 3rd-place match in knockouts', t:'check', v:t.thirdPlace, full:true }) +
    fld({ n:'youtubeUrl', l:'YouTube live link', v:t.youtubeUrl, ph:'https://youtube.com/live/... or channel URL', full:true }) +
    fld({ n:'facebookUrl', l:'Facebook live link', v:t.facebookUrl, ph:'https://facebook.com/.../videos/...', full:true }) +
    fld({ n:'organizer', l:'Organizer contact', v:t.organizer }) +
    fld({ n:'prizes', l:'Prizes', v:t.prizes, ph:'Champion MVR 10,000...' }) +
    fld({ n:'rules', l:'Rules & notes', t:'textarea', v:t.rules, full:true });
  openModal(id ? 'Edit tournament' : 'Create tournament', body, function(d){
    var o = Object.assign(t, d);
    save('tournaments', o);
    if(!id){ setCur(o.id); toast('Tournament created'); location.hash = '#teams'; }
    else toast('Tournament saved');
  }, { wide:true, saveText:id ? 'Save tournament' : 'Create tournament' });
}
function delTournament(id){
  var t = byId('tournaments', id);
  if(!t || !confirm('Delete "' + t.name + '" and all its teams, players, fixtures, payments, awards and transactions? This cannot be undone.')) return;
  ['teams','players','matches','payments','trophies','transactions'].forEach(function(c){
    DB[c].filter(function(x){ return x.tournamentId === id; }).forEach(function(x){ removeDoc(c, x.id); });
  });
  removeDoc('tournaments', id);
  if(CUR === id){ CUR = ''; localStorage.removeItem(CUR_KEY); }
  toast('Tournament deleted');
}

/* ---------------- teams ---------------- */
var TEAM_COLORS = ['#0E5E45','#D13A2B','#2463A8','#F2BE22','#7B3FA0','#E0782F','#1E8C93','#222B33','#C2185B','#6D8B2F','#8C5A3C','#5C6BC0'];
function vTeams(){
  var t = getCur(); if(!t) return noTournament();
  var teams = tTeams(t.id), groups = groupsOf(t.id);
  var full = t.maxTeams && teams.length >= t.maxTeams;
  return head('Teams', teams.length + ' registered' + (t.maxTeams ? ' of ' + t.maxTeams + ' places' : '') + (t.regDeadline ? '. Registration closes ' + fmtDate(t.regDeadline) + '.' : '.'),
    (t.format === 'groups' ? '<button class="btn" onclick="autoGroups()">Draw groups</button>' : '') + '<button class="btn" onclick="window.print()">Print</button><button class="btn pri" onclick="editTeam()"' + (full ? ' disabled title="Maximum teams reached"' : '') + '>Register team</button>') +
    '<section class="panel flush"><div class="pb tbl-wrap"><table class="tbl"><thead><tr><th>Team</th>' + (groups.length || t.format === 'groups' ? '<th>Group</th>' : '') + '<th>Captain / manager</th><th>Contact</th><th class="num">Players</th><th>Entry fee</th><th>Status</th><th></th></tr></thead><tbody>' +
    (teams.length ? teams.map(function(x){
      var pc = teamPlayers(x.id).length;
      var warn = (t.minPlayers && pc < t.minPlayers) ? ' <span class="badge b-warn" title="Below minimum squad size">min ' + t.minPlayers + '</span>' : '';
      return '<tr><td><span class="dot" style="background:' + esc(x.color) + '"></span><b>' + esc(x.name) + '</b> <span class="small muted">' + esc(x.short || '') + '</span></td>' +
        (groups.length || t.format === 'groups' ? '<td>' + esc(x.group || '-') + '</td>' : '') +
        '<td>' + esc(x.captain || '') + (x.manager ? '<div class="small muted">' + esc(x.manager) + '</div>' : '') + '</td><td class="small">' + esc(x.phone || '') + (x.email ? '<br>' + esc(x.email) : '') + '</td>' +
        '<td class="num">' + pc + warn + '</td><td>' + feeBadge(x) + '</td><td><span class="badge ' + (x.status === 'Approved' ? 'b-ok' : x.status === 'Withdrawn' ? 'b-bad' : 'b-warn') + '">' + esc(x.status || 'Pending') + '</span></td>' +
        '<td class="act"><a class="btn sm" href="#players/' + x.id + '">Players</a> <button class="btn sm" onclick="payFee(\'' + x.id + '\')">Take fee</button> <button class="btn sm" onclick="editTeam(\'' + x.id + '\')">Edit</button> <button class="btn sm dang" onclick="delTeam(\'' + x.id + '\')">Delete</button></td></tr>';
    }).join('') : emptyRow(8, 'No teams registered', 'Use Register team to add the first one.')) +
    '</tbody></table></div></section>';
}
function editTeam(id){
  var t = getCur(); if(!t) return;
  var used = tTeams(t.id).map(function(x){ return x.color; });
  var x = byId('teams', id) || { status:'Approved', color:TEAM_COLORS.filter(function(c){ return used.indexOf(c) < 0; })[0] || TEAM_COLORS[0], fee:'' };
  var body =
    fld({ n:'name', l:'Team name', v:x.name, req:true }) +
    fld({ n:'short', l:'Short name (3-4 letters)', v:x.short, ph:'e.g. BLU' }) +
    fld({ n:'color', l:'Team colour', t:'color', v:x.color }) +
    fld({ n:'group', l:'Group', v:x.group, ph:'A, B, C...' }) +
    fld({ n:'captain', l:'Captain', v:x.captain }) +
    fld({ n:'manager', l:'Manager / coach', v:x.manager }) +
    fld({ n:'phone', l:'Contact phone', t:'tel', v:x.phone }) +
    fld({ n:'email', l:'Email', t:'email', v:x.email }) +
    fld({ n:'fee', l:'Entry fee (' + SETTINGS.currency + ')', t:'number', v:x.fee, step:'0.01', hint:'Blank uses the tournament fee of ' + money(t.entryFee) + '.' }) +
    fld({ n:'status', l:'Registration status', t:'select', v:x.status, opts:['Pending','Approved','Withdrawn'] }) +
    fld({ n:'notes', l:'Notes', t:'textarea', v:x.notes, full:true });
  openModal(id ? 'Edit team' : 'Register team', body, function(d){
    var dup = tTeams(t.id).some(function(o){ return o.id !== x.id && o.name.toLowerCase() === d.name.toLowerCase(); });
    if(dup){ toast('A team with this name is already registered'); return false; }
    d.short = (d.short || d.name.replace(/[^A-Za-z]/g, '').slice(0, 3)).toUpperCase();
    d.group = (d.group || '').toUpperCase();
    save('teams', Object.assign(x, d, { tournamentId:t.id }));
    toast(id ? 'Team saved' : 'Team registered');
  }, { saveText:id ? 'Save team' : 'Register team' });
}
function delTeam(id){
  var x = byId('teams', id); if(!x) return;
  var used = DB.matches.some(function(m){ return m.homeId === id || m.awayId === id; });
  if(!confirm('Delete ' + x.name + ' and its players?' + (used ? ' This team is in fixtures; those matches will show TBD.' : ''))) return;
  teamPlayers(id).forEach(function(p){ removeDoc('players', p.id); });
  removeDoc('teams', id);
}
function autoGroups(){
  var t = getCur(); var teams = tTeams(t.id).filter(function(x){ return x.status !== 'Withdrawn'; });
  openModal('Draw groups', fld({ n:'n', l:'Number of groups', t:'number', v:Math.max(2, Math.round(teams.length / 4)), min:1, req:true }) +
    '<p class="full small muted">Teams are shuffled at random and spread evenly into groups A, B, C... Existing group letters are replaced.</p>', function(d){
    var n = Math.max(1, Math.min(num(d.n, 2), teams.length));
    var sh = teams.slice().sort(function(){ return Math.random() - .5; });
    sh.forEach(function(x, i){ x.group = String.fromCharCode(65 + (i % n)); save('teams', x); });
    toast('Groups drawn');
  }, { saveText:'Draw groups' });
}

/* ---------------- players ---------------- */
function vPlayers(r){
  var t = getCur(); if(!t) return noTournament();
  var teams = tTeams(t.id), teamId = r.a || '';
  var list = tPlayers(t.id).filter(function(p){ return !teamId || p.teamId === teamId; }).sort(function(a, b){ return teamName(a.teamId).localeCompare(teamName(b.teamId)) || num(a.number, 999) - num(b.number, 999); });
  var st = playerStats(t.id), sp = SPORTS[t.sport] || SPORTS.Other;

function recipientName(id){ var tm = byId('teams', id); if(tm) return tm.name; var p = byId('players', id); return p ? p.name + ' (' + teamName(p.teamId) + ')' : ''; }
function awardSuggestions(t){
  var S = {}, ms = tMatches(t.id);
  var fin = ms.filter(function(m){ return m.ko && m.stage === 'Final'; })[0];
  if(fin && fin.status === 'finished'){ var w = winnerOf(fin), l = loserOf(fin); if(w) S['Champion'] = { id:w, label:teamName(w) }; if(l) S['Runner-up'] = { id:l, label:teamName(l) }; }
  var tp = ms.filter(function(m){ return m.stage === '3rd place'; })[0];
  if(tp && tp.status === 'finished' && winnerOf(tp)) S['Third place'] = { id:winnerOf(tp), label:teamName(winnerOf(tp)) };
  if(!fin && t.format === 'league' && ms.length && ms.every(function(m){ return m.status === 'finished' || m.bye; })){
    var st = standings(t); if(st[0]) S['Champion'] = { id:st[0].team.id, label:st[0].team.name }; if(st[1]) S['Runner-up'] = { id:st[1].team.id, label:st[1].team.name }; if(st[2]) S['Third place'] = { id:st[2].team.id, label:st[2].team.name };
  }
  var ps = playerStats(t.id), ids = Object.keys(ps).filter(function(k){ return byId('players', k); });
  var top = ids.slice().sort(function(a, b){ return ps[b].pts - ps[a].pts; })[0];
  if(top && ps[top].pts) S['Top scorer'] = { id:top, label:byId('players', top).name + ' (' + ps[top].pts + ')' };
  var mvp = ids.slice().sort(function(a, b){ return ps[b].motm - ps[a].motm || ps[b].pts - ps[a].pts; })[0];
  if(mvp && ps[mvp].motm) S['Best player'] = { id:mvp, label:byId('players', mvp).name + ' (' + ps[mvp].motm + ' MOTM)' };
  var fair = tTeams(t.id).map(function(tm){ var c = 0; teamPlayers(tm.id).forEach(function(p){ var s = ps[p.id]; if(s) c += s.yc + s.rc * 3; }); return { tm:tm, c:c }; }).sort(function(a, b){ return a.c - b.c; })[0];
  if(fair && ms.some(function(m){ return m.status === 'finished'; })) S['Fair play team'] = { id:fair.tm.id, label:fair.tm.name };
  return S;
}

function saveOrg(e){
  e.preventDefault();
  var d = formData(e.target);
  SETTINGS.org = d.org; SETTINGS.currency = d.currency; SETTINGS.pin = d.pin;
  SETTINGS.venues = d.venues.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  if(d.pin) sessionStorage.setItem(PIN_OK, d.pin);
  saveSettings(); toast('Settings saved');
}
function parseCfg(txt){
  txt = txt.trim().replace(/^[^{]*/, '').replace(/;?\s*$/, '');
  try { return JSON.parse(txt); } catch(e){}
  try { return (new Function('return (' + txt + ')'))(); } catch(e){ return null; }
}
function connectFb(){
  var txt = $('#fbcfg').value, cfg = parseCfg(txt);
  if(!cfg || !cfg.projectId){ toast('That config is missing projectId. Paste the firebaseConfig object from the Firebase console.'); return; }
  localStorage.setItem(FB_KEY, JSON.stringify(cfg));
  toast('Connecting...');
  setTimeout(function(){ location.reload(); }, 400);
}
function disconnectFb(){ if(!confirm('Disconnect cloud sync on this device? Data on Firebase is kept.')) return; localStorage.removeItem(FB_KEY); location.reload(); }
function exportAll(){ downloadFile('tournament_backup_' + today() + '.json', JSON.stringify({ app:'tournament-office', version:1, exportedAt:new Date().toISOString(), settings:SETTINGS, db:DB }, null, 1), 'application/json'); }
function importAll(file){
  if(!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var d = JSON.parse(rd.result);
      if(!d.db) throw new Error('Not a backup file');
      if(!confirm('Restore this backup? Records with matching IDs are replaced; other records are kept.')) return;
      Object.assign(SETTINGS, d.settings || {}); saveSettings();
      COLS.forEach(function(c){ (d.db[c] || []).forEach(function(o){ save(c, o); }); });
      toast('Backup restored');
    } catch(e){ toast('Could not read file: ' + e.message); }
  };
  rd.readAsText(file);
}
function wipeAll(){
  if(!confirm('Erase ALL tournaments, teams, players, matches and money records' + (MODE === 'firebase' ? ' from Firebase' : ' on this device') + '?')) return;
  if(prompt('Type ERASE to confirm') !== 'ERASE') return;
  COLS.forEach(function(c){ DB[c].slice().forEach(function(x){ removeDoc(c, x.id); }); });

}

    '<section class="panel flush"><div class="pb tbl-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Stage</th><th class="right">Home</th><th style="text-align:center">Score</th><th>Away</th><th>Venue / officials</th><th>Status</th><th></th></tr></thead><tbody>' +
    (ms.length ? body : emptyRow(8, 'No fixtures', tTeams(t.id).length >= 2 ? 'Use Generate fixtures to build the schedule automatically, or add matches one by one.' : 'Register at least two teams first.')) +
    '</tbody></table></div></section>';
}
function fixtureRow(m){

  var w = winnerOf(m);
  return '<tr><td class="nowrap">' + esc(m.time || '') + '</td><td class="small">' + esc(m.stage || '') + '</td>' +

    '<td' + (w && w === m.awayId ? ' style="font-weight:700"' : '') + '><span class="dot" style="background:' + esc(teamColor(m.awayId)) + '"></span>' + esc(teamName(m.awayId)) + '</td>' +
    '<td class="small">' + esc(m.venue || '') + (m.bye ? '' : '<div class="muted">' + (refNames(m) ? esc(refNames(m)) : 'No officials assigned') + '</div>') + '</td><td>' + statusBadge(m) + '</td>' +

    fld({ n:'youtubeUrl', l:'YouTube live link for this match', v:m.youtubeUrl, full:true, hint:'Leave blank to use the tournament stream.' }) +

    if(clash && !confirm('Another match is already booked at ' + d.venue + ' on ' + d.date + ' ' + d.time + '. Save anyway?')) return false;

function delMatch(id){ if(confirm('Delete this match and its scores?')) removeDoc('matches', id); }

/* fixture generation */
function roundRobin(ids){
  var a = ids.slice(); if(a.length % 2) a.push(null);
  var n = a.length, rounds = [];
  for(var r = 0; r < n - 1; r++){
    var pairs = [];
    for(var i = 0; i < n / 2; i++){ var x = a[i], y = a[n - 1 - i]; if(x && y) pairs.push(r % 2 ? [y, x] : [x, y]); }
    rounds.push(pairs);
    a.splice(1, 0, a.pop());
  }
  return rounds;
}
function koRoundName(n){ return n === 2 ? 'Final' : n === 4 ? 'Semi-final' : n === 8 ? 'Quarter-final' : 'Round of ' + n; }
function buildKO(tid, order, round){
  var P = 1; while(P < order.length) P *= 2;
  var slots = order.slice(); while(slots.length < P) slots.push(null);
  var out = [];
  for(var i = 0; i < P / 2; i++){
    var a = slots[i], b = slots[P - 1 - i];
    if(!a && !b) continue;
    var m = { tournamentId:tid, ko:true, round:round, slot:i, stage:koRoundName(P), homeId:a || b, awayId:a && b ? b : '', status:'scheduled', events:[] };
    if(!(a && b)){ m.bye = true; m.status = 'finished'; }
    out.push(m);
  }
  return out;
}
function scheduleList(list, o){
  var real = list.filter(function(m){ return !m.bye; }), per = Math.max(1, num(o.perDay, 4)), gap = num(o.gap, 60);
  var st = (o.startTime || '16:00').split(':'), base = num(st[0]) * 60 + num(st[1]);
  var venues = o.venue ? [o.venue] : [''];
  real.forEach(function(m, k){
    var day = Math.floor(k / per), slot = k % per, mins = base + slot * gap;
    m.date = o.startDate ? addDays(o.startDate, day * Math.max(1, num(o.every, 1))) : '';
    m.time = pad(Math.floor(mins / 60) % 24) + ':' + pad(mins % 60);
    m.venue = venues[0];
  });
  list.filter(function(m){ return m.bye; }).forEach(function(m){ m.date = o.startDate || ''; m.time = ''; });
}
function genFixtures(){
  var t = getCur(), teams = tTeams(t.id).filter(function(x){ return x.status !== 'Withdrawn'; });
  if(teams.length < 2){ toast('Register at least two teams first'); return; }
  var existing = tMatches(t.id);
  var body = fld({ n:'format', l:'Format', t:'select', v:t.format, opts:[{ v:'league', l:FORMAT_LABEL.league }, { v:'knockout', l:FORMAT_LABEL.knockout }, { v:'groups', l:'Group stage (knockout comes after)' }] }) +
    fld({ n:'legs', l:'Each pair meets', t:'select', v:'1', opts:[{ v:'1', l:'Once' }, { v:'2', l:'Twice (home and away)' }] }) +
    fld({ n:'startDate', l:'First match day', t:'date', v:t.startDate || today(), req:true }) +
    fld({ n:'startTime', l:'First kick-off', t:'time', v:'16:00', req:true }) +
    fld({ n:'perDay', l:'Matches per day', t:'number', v:4, min:1, req:true }) +

  rr.forEach(function(r, i){ r.forEach(function(p){ list.push({ tournamentId:t.id, stage:'League', round:i + 1, homeId:p[0], awayId:p[1], status:'scheduled', events:[] }); }); });
  scheduleList(list, { startDate:addDays(today(), -1), startTime:'17:00', perDay:3, gap:50, venue:'Main ground' });
  list.forEach(function(m, i){
    m.refereeIds = [refs[i % 2].id, refs[2].id];
    if(i < 4){
      m.status = 'finished'; m.period = '2nd half'; m.clock = { running:false, base:40 * 60 };
      var g = [[3,1],[2,2],[0,1],[4,2]][i];
      [['home', g[0]], ['away', g[1]]].forEach(function(sd){
        var tid = sd[0] === 'home' ? m.homeId : m.awayId, pl = DB.players.filter(function(p){ return p.teamId === tid; });
        for(var k = 0; k < sd[1]; k++){ var p = pl[1 + ((k * 3 + i) % (pl.length - 1))]; m.events.push({ id:uid(), at:Date.now(), min:5 + k * 9 + i, type:'Goal', side:sd[0], playerId:p.id, pts:1, text:p.name + ' scores for ' + teamName(tid) }); }
      });
      var cp = DB.players.filter(function(p){ return p.teamId === m.awayId; })[2];
      m.events.push({ id:uid(), at:Date.now(), min:28, type:'Yellow card', side:'away', playerId:cp.id, pts:0, text:teamName(m.awayId) + ', ' + cp.name });
      m.events.sort(function(a, b){ return a.min - b.min; });
      m.motm = m.events[0].playerId;
    }
    if(i === 4){
      m.status = 'live'; m.date = today(); m.period = '2nd half'; m.clock = { running:true, base:24 * 60, startedAt:Date.now() };
      var hp = DB.players.filter(function(p){ return p.teamId === m.homeId; });
      m.events = [{ id:uid(), at:Date.now(), min:1, type:'Comment', text:'Kick-off! ' + teamName(m.homeId) + ' v ' + teamName(m.awayId) }, { id:uid(), at:Date.now(), min:12, type:'Goal', side:'home', playerId:hp[3].id, pts:1, text:hp[3].name + ' scores for ' + teamName(m.homeId) + ' with a low shot to the far post' }, { id:uid(), at:Date.now(), min:21, type:'Comment', text:'Big save keeps it 1-0 at the break.' }];
    }
    save('matches', m);
  });
  teams.forEach(function(tm, i){ if(i < 4) save('payments', { tournamentId:t.id, teamId:tm.id, amount:1500, date:addDays(today(), -7), method:i % 2 ? 'Bank transfer' : 'Cash', receiptNo:'R-ISL-' + String(i + 1).padStart(4, '0'), receivedBy:'Treasurer' }); });
  save('payments', { tournamentId:t.id, teamId:teams[4].id, amount:750, date:addDays(today(), -3), method:'Cash', receiptNo:'R-ISL-0005', receivedBy:'Treasurer' });
  save('transactions', { tournamentId:t.id, type:'income', category:'Sponsorship', amount:8000, date:addDays(today(), -10), method:'Bank transfer', party:'Local resort', desc:'Title sponsor' });
  save('transactions', { tournamentId:t.id, type:'expense', category:'Venue & ground', amount:3500, date:addDays(today(), -2), method:'Cash', desc:'Ground hire and lights, 7 nights' });
  save('transactions', { tournamentId:t.id, type:'expense', category:'Equipment', amount:1200, date:addDays(today(), -4), method:'Cash', desc:'Match balls and bibs' });
  save('transactions', { tournamentId:t.id, type:'expense', category:'Media & streaming', amount:900, date:addDays(today(), -1), method:'Bank transfer', desc:'Camera operator' });
  [['Champion','team',1,2500,'Ordered'],['Runner-up','team',1,1500,'Ordered'],['Best player','player',1,600,'Planned'],['Top scorer','player',1,600,'Planned'],['Fair play team','team',1,400,'Planned']].forEach(function(a, i){ save('trophies', { tournamentId:t.id, title:a[0], kind:a[1], qty:a[2], cost:a[3], status:a[4], order:i, date:a[4] === 'Ordered' ? addDays(today(), -5) : '' }); });
  setCur(t.id);
  location.hash = '#dashboard';
  toast('Demo tournament loaded');
}

/* ---------------- boot ---------------- */
var VIEWS = { dashboard:vDashboard, tournaments:vTournaments, teams:vTeams, players:vPlayers, referees:vReferees, matches:vMatches, live:vLive, standings:vStandings, stream:vStream, fees:vFees, finance:vFinance, trophies:vTrophies, settings:vSettings, board:vBoard, match:vMatchBoard, overlay:vOverlay };
window.addEventListener('hashchange', function(){ document.body.classList.remove('nav-open'); render(); window.scrollTo(0, 0); });
window.addEventListener('storage', function(e){ if(e.key === APP_KEY && MODE === 'local'){ loadLocal(); scheduleRender(); } });
(function boot(){
  loadLocal();
  var cfgTxt = localStorage.getItem(FB_KEY);
  if(cfgTxt){
    var cfg = null; try { cfg = JSON.parse(cfgTxt); } catch(e){}
    if(cfg){
      $('#main').innerHTML = '<div class="empty"><b>Connecting to cloud...</b></div>';
      initFirebase(cfg).then(render).catch(function(e){ console.error(e); MODE = 'local'; toast('Cloud sync failed, using this device: ' + e.message); render(); });
      return;
    }
  }
  render();
})();
</script>
